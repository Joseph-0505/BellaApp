# Demonstração atrás de um proxy externo, que encerra o TLS.
# Os upstreams usam o nome do contêiner porque o Nginx também está na rede do proxy,
# onde outros projetos têm serviços chamados "frontend" e "backend".
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    set $frontend_upstream bellaapp-frontend:4173;
    set $backend_upstream bellaapp-backend:3000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location / {
        proxy_pass http://$frontend_upstream;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        proxy_pass http://$backend_upstream;
    }
}
