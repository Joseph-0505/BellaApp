openapi: 3.0.3
info:
  title: BellaApp API
  version: 1.4.0
  description: |
    API do BellaApp para autenticação, configuração da clínica, clientes,
    catálogo de serviços e agenda.

    Para testar uma rota protegida nesta página:
    1. execute `POST /api/v1/auth/login`;
    2. copie `data.token` da resposta;
    3. clique em **Authorize** e informe somente o token;
    4. execute a rota desejada. O Swagger UI adicionará o prefixo `Bearer`.
  contact:
    name: Equipe BellaApp
servers:
  - url: /
    description: Mesmo host da documentação
  - url: http://localhost:3000
    description: Backend local exposto pelo Docker Compose
tags:
  - name: Saúde
    description: Disponibilidade da aplicação e de suas dependências.
  - name: Autenticação
    description: Cadastro, login e ciclo dos tokens.
  - name: Usuário
    description: Conta autenticada.
  - name: Onboarding
    description: Configuração inicial da clínica.
  - name: Clientes
    description: Cadastro e consulta de clientes da clínica.
  - name: Serviços
    description: Catálogo de serviços da clínica.
  - name: Agenda
    description: Agendamentos da clínica.
  - name: Profissionais
    description: Equipe da clínica, convites e status de acesso.
  - name: Salas
    description: Recursos físicos opcionais usados na agenda.
  - name: Plano
    description: Plano contratado pela clínica.
  - name: Cobranças
    description: Pagamento das cobranças geradas por atendimentos concluídos.
  - name: Caixa
    description: Abertura, consulta e fechamento do caixa do dia.
  - name: Imagens
    description: Avatares de perfil enviados pelos usuários.
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [Saúde]
      summary: Verifica a saúde do backend, MySQL e Redis
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Aplicação e dependências obrigatórias saudáveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              example:
                data:
                  status: ok
                  timestamp: "2026-11-09T15:00:00.000Z"
                  uptimeSeconds: 3600
                  dependencies:
                    mysql: { status: up, latencyMs: 4 }
                    redis: { status: up, latencyMs: 2 }
        "503":
          description: Uma dependência obrigatória está indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /api/v1/auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra a conta administradora
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Maria Silva
              email: maria@example.com
              password: Senha@123
              cpf: "52998224725"
              businessName: Clínica Bella
              cnpj: "11222333000181"
      responses:
        "201":
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: E-mail, CPF ou CNPJ já cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica e emite tokens
      description: Use `data.token` no botão **Authorize** para testar as rotas protegidas.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: maria@example.com
              password: Senha@123
      responses:
        "200":
          description: Login realizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/refresh:
    post:
      tags: [Autenticação]
      summary: Renova o par de tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Novos tokens emitidos; o refresh token anterior deixa de ser válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão associada ao refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/me:
    get:
      tags: [Usuário]
      summary: Retorna o usuário autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuário e contexto da clínica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Usuário]
      summary: Atualiza os dados da conta
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Conta atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Usuário]
      summary: Exclui a conta autenticada
      operationId: deleteCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, confirmation]
              properties:
                password:
                  type: string
                  format: password
                  maxLength: 72
                confirmation:
                  type: string
                  enum: [EXCLUIR]
      responses:
        "204":
          description: Conta excluída.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding/status:
    get:
      tags: [Onboarding]
      summary: Consulta se a configuração inicial foi concluída
      operationId: getOnboardingStatus
      responses:
        "200":
          description: Estado do onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatusEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding/complete:
    post:
      tags: [Onboarding]
      summary: Conclui a configuração inicial da clínica
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessName]
              properties:
                businessName:
                  type: string
                  minLength: 1
                  maxLength: 255
            example: { businessName: Clínica Bella }
      responses:
        "200":
          description: Configuração concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteOnboardingEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Onboarding já concluído ou conflito de dados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/clients:
    get:
      tags: [Clientes]
      summary: Lista clientes da clínica
      operationId: listClients
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Clientes]
      summary: Cadastra um cliente
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
            example:
              name: Ana Souza
              phone: "+55 11 99999-0000"
              email: ana@example.com
              cpf: "52998224725"
              notes: Prefere atendimento pela manhã.
      responses:
        "201":
          description: Cliente criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: CPF ou e-mail em conflito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Clientes]
      summary: Busca um cliente
      operationId: getClient
      responses:
        "200":
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Clientes]
      summary: Atualiza um cliente
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
      responses:
        "200":
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Clientes]
      summary: Exclui um cliente
      operationId: deleteClient
      responses:
        "204":
          description: Cliente excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/services:
    get:
      tags: [Serviços]
      summary: Lista o catálogo da clínica
      operationId: listServices
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: active
          in: query
          schema: { type: boolean }
        - name: risk
          in: query
          schema:
            $ref: "#/components/schemas/ServiceRisk"
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: minDurationMinutes
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxDurationMinutes
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Página do catálogo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Serviços]
      summary: Cadastra um serviço
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
            example:
              name: Limpeza de pele
              description: Higienização e hidratação facial.
              price: 180
              durationMinutes: 60
              risk: baixo
              icon: face
              active: true
      responses:
        "201":
          description: Serviço criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Serviços]
      summary: Busca um serviço
      operationId: getService
      responses:
        "200":
          description: Serviço encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Serviços]
      summary: Atualiza um serviço
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
      responses:
        "200":
          description: Serviço atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Serviços]
      summary: Exclui um serviço
      operationId: deleteService
      responses:
        "204":
          description: Serviço excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/appointments:
    get:
      tags: [Agenda]
      summary: Lista agendamentos da clínica
      operationId: listAppointments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: date
          in: query
          description: Data local no formato YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: clientId
          in: query
          schema: { type: string, format: uuid }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
        - name: professionalId
          in: query
          schema: { type: string, format: uuid }
        - name: roomId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Página de agendamentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Agenda]
      summary: Cria um agendamento
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequest"
            example:
              clientId: 84b1b44c-9a92-4d7a-9023-0ea35fbb40b6
              serviceId: b88cf0a5-a86c-459a-80c5-dd221d13ab29
              professionalId: e77f5c82-1219-4828-9555-b582b878fc3e
              scheduledAt: "2026-11-10T14:30:00-03:00"
              status: SCHEDULED
              notes: Primeira consulta.
      responses:
        "201":
          description: Agendamento criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflito de horário ou regra de negócio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Agenda]
      summary: Busca um agendamento
      operationId: getAppointment
      responses:
        "200":
          description: Agendamento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Agenda]
      summary: Atualiza um agendamento
      operationId: updateAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequest"
      responses:
        "200":
          description: Agendamento atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflito de horário ou regra de negócio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Agenda]
      summary: Exclui um agendamento
      operationId: deleteAppointment
      responses:
        "204":
          description: Agendamento excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/appointments/{id}/complete:
    post:
      tags: [Agenda]
      summary: Conclui um agendamento e gera a cobrança
      operationId: completeAppointment
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                receivedBy:
                  type: string
                  enum: [CLINIC, PROFESSIONAL]
              example: { receivedBy: CLINIC }
      responses:
        "200":
          description: Agendamento concluído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Agendamento já concluído ou não pode ser concluído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/activation:
    get:
      tags: [Autenticação]
      summary: Consulta um convite de ativação
      description: Usado pela tela de ativação para mostrar clínica, nome e e-mail do convite.
      operationId: getActivationStatus
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Convite válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationStatusEnvelope"
        "400":
          $ref: "#/components/responses/InviteError"
        "409":
          $ref: "#/components/responses/InviteError"
        "410":
          $ref: "#/components/responses/InviteError"
  /api/v1/auth/activate:
    post:
      tags: [Autenticação]
      summary: Ativa a conta de um profissional convidado
      operationId: activateAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountRequest"
      responses:
        "200":
          description: Conta ativada; o profissional já pode fazer login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateAccountEnvelope"
        "400":
          description: Dados inválidos ou token de convite inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/InviteError"
        "410":
          $ref: "#/components/responses/InviteError"
  /api/v1/users/me/avatar:
    post:
      tags: [Usuário]
      summary: Envia a foto de perfil
      operationId: uploadCurrentUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: Imagem JPEG, PNG ou WebP de até 5 MB.
      responses:
        "200":
          description: Avatar atualizado; `avatarUrl` aponta para a nova imagem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          description: Arquivo ausente ou conteúdo que não é uma imagem válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Imagem maior que 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: IMAGE_TOO_LARGE
                  message: A imagem deve ter no máximo 5 MB.
    delete:
      tags: [Usuário]
      summary: Remove a foto de perfil
      operationId: removeCurrentUserAvatar
      responses:
        "200":
          description: Avatar removido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profile-images/{fileName}:
    get:
      tags: [Imagens]
      summary: Baixa uma imagem de perfil
      description: Endereço público retornado em `avatarUrl`. A resposta é cacheável por um ano.
      operationId: getProfileImage
      security: []
      parameters:
        - name: fileName
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conteúdo da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/professionals:
    get:
      tags: [Profissionais]
      summary: Lista profissionais da clínica
      operationId: listProfessionals
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
            enum: [ativo, inativo]
      responses:
        "200":
          description: Página de profissionais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Profissionais]
      summary: Cadastra um profissional sem acesso ao sistema
      operationId: createProfessional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalRequest"
            example:
              name: Carla Lima
              specialty: Esteticista
              phone: "+55 11 98888-0000"
              email: carla@example.com
              status: ativo
      responses:
        "201":
          description: Profissional criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TrialExpired"
        "409":
          $ref: "#/components/responses/PlanLimit"
  /api/v1/professionals/invite:
    post:
      tags: [Profissionais]
      summary: Convida um profissional por e-mail
      description: Cria o profissional e envia um link de ativação com prazo de validade.
      operationId: inviteProfessional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteProfessionalRequest"
            example:
              name: Carla Lima
              email: carla@example.com
      responses:
        "201":
          description: Convite criado; `accessStatus` fica `invite_pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TrialExpired"
        "409":
          $ref: "#/components/responses/PlanLimit"
  /api/v1/professionals/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Profissionais]
      summary: Busca um profissional
      operationId: getProfessional
      responses:
        "200":
          description: Profissional encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Profissionais]
      summary: Atualiza um profissional
      operationId: updateProfessional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionalRequest"
      responses:
        "200":
          description: Profissional atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: E-mail já cadastrado para outro usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Profissionais]
      summary: Exclui um profissional
      operationId: deleteProfessional
      responses:
        "204":
          description: Profissional excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Último profissional da clínica ou profissional vinculado a um usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/professionals/{id}/resend-invite:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Profissionais]
      summary: Reenvia o convite de ativação
      operationId: resendProfessionalInvite
      responses:
        "200":
          description: Novo convite gerado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Profissional sem e-mail, sem convite disponível ou com conta já ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/rooms:
    get:
      tags: [Salas]
      summary: Lista salas da clínica
      operationId: listRooms
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Página de salas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Salas]
      summary: Cadastra uma sala
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomRequest"
            example:
              name: Sala 1
              color: "#E8B4B8"
              active: true
      responses:
        "201":
          description: Sala criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Já existe uma sala com esse nome na clínica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Salas]
      summary: Busca uma sala
      operationId: getRoom
      responses:
        "200":
          description: Sala encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Salas]
      summary: Atualiza uma sala
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomRequest"
      responses:
        "200":
          description: Sala atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Salas]
      summary: Exclui uma sala
      operationId: deleteRoom
      responses:
        "204":
          description: Sala excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/billing:
    get:
      tags: [Plano]
      summary: Consulta o plano da clínica
      operationId: getCurrentPlan
      responses:
        "200":
          description: Plano atual e fim do período de teste.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/billing/upgrade:
    post:
      tags: [Plano]
      summary: Faz upgrade do plano
      operationId: upgradePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradePlanRequest"
            example:
              plan: TEAM
      responses:
        "200":
          description: Plano alterado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cobrancas/{id}/pagar:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Cobranças]
      summary: Registra o pagamento de uma cobrança
      description: |
        Aceita pagamento parcial. Atualiza o saldo da cobrança e cria a
        movimentação de entrada no caixa na mesma transação. Publica o evento
        `billing.paid` depois do commit.
      operationId: payBilling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayBillingRequest"
            example:
              amount: 150
              paymentMethod: PIX
              notes: Pagamento na recepção.
      responses:
        "200":
          description: Pagamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayBillingEnvelope"
        "400":
          description: Dados inválidos ou valor maior que o saldo da cobrança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cobrança já quitada ou caixa do dia fechado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/caixa:
    get:
      tags: [Caixa]
      summary: Consulta o caixa do dia
      description: Retorna `data` nulo quando o caixa do dia ainda não foi aberto.
      operationId: getTodayCash
      parameters:
        - name: professionalId
          in: query
          description: Caixa de um profissional. Sem o parâmetro, retorna o caixa da clínica.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Caixa do dia, ou nulo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableCashEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/caixa/abrir:
    post:
      tags: [Caixa]
      summary: Abre o caixa do dia
      operationId: openTodayCash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCashRequest"
            example:
              openingAmount: 100
      responses:
        "201":
          description: Caixa aberto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Caixa do dia já aberto ou já fechado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/caixa/fechar:
    post:
      tags: [Caixa]
      summary: Fecha o caixa do dia
      description: Calcula a diferença entre o valor esperado e o valor informado.
      operationId: closeTodayCash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCashRequest"
            example:
              informedClosingAmount: 450
      responses:
        "200":
          description: Caixa fechado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Caixa do dia não foi aberto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Caixa do dia já fechado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token retornado por `POST /api/v1/auth/login`.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador UUID do recurso.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Token ausente, inválido, expirado ou sessão encerrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INVALID_TOKEN
              message: Token inválido ou expirado.
    ValidationError:
      description: Parâmetros ou corpo inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_ERROR
              message: Dados inválidos.
              details:
                - path: email
                  message: Email inválido.
    NotFound:
      description: Recurso não encontrado no escopo da clínica.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Recurso não encontrado.
    TrialExpired:
      description: Período de teste expirado; é preciso fazer upgrade do plano.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: TRIAL_EXPIRED
              message: Seu periodo de teste expirou. Faca upgrade para continuar.
    PlanLimit:
      description: Limite de profissionais do plano atingido (`TRIAL_LIMIT` ou `PLAN_LIMIT`), ou e-mail já cadastrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InviteError:
      description: |
        Convite inválido (400 `INVITE_TOKEN_INVALID`), já utilizado ou conta já
        ativa (409 `INVITE_TOKEN_USED`, `ACCOUNT_ALREADY_ACTIVE`) ou expirado
        (410 `INVITE_TOKEN_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        path: { type: string }
        message: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dados inválidos.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    MessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message: { type: string }
    HealthDependency:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [disabled, down, up]
        latencyMs:
          type: number
          minimum: 0
    Health:
      type: object
      required: [status, timestamp, uptimeSeconds, dependencies]
      properties:
        status:
          type: string
          enum: [down, ok]
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: number
          minimum: 0
        dependencies:
          type: object
          required: [mysql, redis]
          properties:
            mysql: { $ref: "#/components/schemas/HealthDependency" }
            redis: { $ref: "#/components/schemas/HealthDependency" }
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Health" }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, cpf]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Deve conter maiúscula, minúscula, número e símbolo.
        cpf: { type: string, description: CPF com ou sem pontuação. }
        businessName: { type: string, maxLength: 255 }
        cnpj: { type: string, description: CNPJ com ou sem pontuação. }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, maxLength: 72 }
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name, cpf, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        cpf: { type: string }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Confirma a alteração e deve cumprir a política de senha.
        businessName: { type: string, maxLength: 255 }
        cnpj: { type: string }
    OnboardingStatus:
      type: object
      required: [completed, businessName, hasTeam, usesRooms, servicesCount, professionalsCount, roomsCount, defaultSchedule]
      properties:
        completed: { type: boolean }
        businessName: { type: string }
        hasTeam: { type: boolean }
        usesRooms: { type: boolean }
        servicesCount: { type: integer, minimum: 0 }
        professionalsCount: { type: integer, minimum: 0 }
        roomsCount: { type: integer, minimum: 0 }
        defaultSchedule:
          type: object
          required: [mondayToFriday, saturday, sunday]
          properties:
            mondayToFriday:
              type: object
              properties:
                start: { type: string, example: "08:00" }
                end: { type: string, example: "18:00" }
            saturday:
              type: object
              properties:
                start: { type: string, example: "08:00" }
                end: { type: string, example: "12:00" }
            sunday:
              type: object
              properties:
                closed: { type: boolean, enum: [true] }
    OnboardingStatusEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/OnboardingStatus" }
    CompleteOnboarding:
      allOf:
        - $ref: "#/components/schemas/OnboardingStatus"
        - type: object
          required: [created]
          properties:
            created:
              type: object
              required: [professional, services, rooms]
              properties:
                professional: { type: boolean }
                services:
                  type: array
                  items: { type: string }
                rooms:
                  type: array
                  items: { type: string }
    CompleteOnboardingEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CompleteOnboarding" }
    User:
      type: object
      required: [id, name, email, cpf, businessProfile, clinic, membership, professional, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        cpf: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        businessProfile:
          type: object
          nullable: true
          properties:
            businessName: { type: string }
            cnpj: { type: string, nullable: true }
            hasTeam: { type: boolean }
            usesRooms: { type: boolean }
        clinic:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            plan: { type: string }
            trialEndsAt: { type: string, format: date-time, nullable: true }
        membership:
          type: object
          nullable: true
          properties:
            role: { type: string }
            professionalId: { type: string, format: uuid, nullable: true }
        professional:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            specialty: { type: string }
        permissions:
          type: object
          required: [manageProfessionals, viewAllAgenda, viewAllCash]
          properties:
            manageProfessionals: { type: boolean }
            viewAllAgenda: { type: boolean }
            viewAllCash: { type: boolean }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/User" }
    LoginData:
      allOf:
        - type: object
          required: [token, refreshToken, expiresIn, refreshTokenExpiresIn, user]
          properties:
            token: { type: string, description: JWT de acesso. }
            refreshToken: { type: string, description: JWT usado somente para renovação. }
            expiresIn: { type: string, example: 1d }
            refreshTokenExpiresIn: { type: string, example: 7d }
            user: { $ref: "#/components/schemas/User" }
    LoginEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/LoginData" }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ClientRequest:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        email: { type: string, format: email }
        cpf: { type: string }
        notes: { type: string, maxLength: 500 }
    Client:
      type: object
      required: [id, name, email, phone, cpf, notes, latestVisitAt, latestVisitNote, nextAppointmentAt, professional, totalSpent, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string }
        cpf: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        latestVisitAt: { type: string, format: date-time, nullable: true }
        latestVisitNote: { type: string }
        nextAppointmentAt: { type: string, format: date-time, nullable: true }
        professional: { type: string, nullable: true }
        totalSpent: { type: number, minimum: 0 }
        status:
          type: string
          enum: [novo, ativo, inativo, risco]
    ClientEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Client" }
    ClientListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Client" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    ServiceRisk:
      type: string
      enum: [baixo, medio, alto]
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [name, price, durationMinutes, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        price: { type: number, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        risk: { $ref: "#/components/schemas/ServiceRisk" }
        icon:
          type: string
          enum: [face, syringe, wand, drop, lotus, flask, spark, pulse, leaf]
        active: { type: boolean }
    Service:
      type: object
      required: [id, name, description, price, durationMinutes, active, risk, riskTone, riskLabel, icon, soldCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        active: { type: boolean }
        risk: { $ref: "#/components/schemas/ServiceRisk" }
        riskTone: { $ref: "#/components/schemas/ServiceRisk" }
        riskLabel: { type: string }
        icon: { type: string }
        soldCount: { type: integer, minimum: 0 }
    ServiceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Service" }
    ServiceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    AppointmentStatus:
      type: string
      enum: [SCHEDULED, CONFIRMED, COMPLETED, CANCELED]
    AppointmentRequest:
      type: object
      additionalProperties: false
      required: [clientId, serviceId, professionalId, scheduledAt, status]
      properties:
        clientId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        professionalId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        notes: { type: string, maxLength: 500 }
    Appointment:
      type: object
      required: [id, clientId, serviceId, professionalId, roomId, scheduledAt, status, receivedBy, notes, billingId, billingAmount, billingStatus, outstandingAmount]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        professionalId: { type: string, format: uuid, nullable: true }
        roomId: { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        receivedBy:
          type: string
          enum: [CLINIC, PROFESSIONAL]
        notes: { type: string, nullable: true }
        billingId: { type: string, format: uuid, nullable: true }
        billingAmount: { type: number, nullable: true }
        billingStatus:
          type: string
          enum: [PENDING, PARTIALLY_PAID, PAID]
          nullable: true
        outstandingAmount: { type: number, nullable: true }
    AppointmentEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Appointment" }
    AppointmentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    ActivationStatus:
      type: object
      required: [clinicName, email, name]
      properties:
        clinicName: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    ActivationStatusEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ActivationStatus" }
    ActivateAccountRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Deve conter maiúscula, minúscula, número e símbolo.
    ActivateAccountEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [email, name]
          properties:
            email: { type: string, format: email }
            name: { type: string }
    ProfessionalRequest:
      type: object
      additionalProperties: false
      required: [name, specialty, phone, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        specialty: { type: string, minLength: 1, maxLength: 255 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        email: { type: string, format: email }
        status:
          type: string
          enum: [ativo, inativo]
    InviteProfessionalRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
    Professional:
      type: object
      required: [id, name, specialty, email, phone, status, initials, tone, accessStatus, inviteExpiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialty: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string }
        status:
          type: string
          enum: [ativo, inativo]
        initials: { type: string, example: CL }
        tone:
          type: string
          enum: [rose, sand, sage, mist]
        accessStatus:
          type: string
          enum: [active, invite_pending, invite_expired, no_access]
        inviteExpiresAt: { type: string, format: date-time, nullable: true }
    ProfessionalEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Professional" }
    ProfessionalListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Professional" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    RoomRequest:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#E8B4B8"
        active: { type: boolean }
    Room:
      type: object
      required: [id, name, color, active, status, monthlyAppointments, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, nullable: true }
        active: { type: boolean }
        status:
          type: string
          enum: [ativo, inativo]
        monthlyAppointments: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoomEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Room" }
    RoomListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    ClinicPlan:
      type: string
      enum: [TRIAL, INDIVIDUAL, TEAM]
    Plan:
      type: object
      required: [plan, trialEndsAt]
      properties:
        plan: { $ref: "#/components/schemas/ClinicPlan" }
        trialEndsAt: { type: string, format: date-time, nullable: true }
    PlanEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Plan" }
    UpgradePlanRequest:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan:
          type: string
          enum: [INDIVIDUAL, TEAM]
    PaymentMethod:
      type: string
      enum: [CASH, PIX, CREDIT_CARD, DEBIT_CARD, TRANSFER, OTHER]
    PayBillingRequest:
      type: object
      additionalProperties: false
      required: [amount, paymentMethod]
      properties:
        amount: { type: number, exclusiveMinimum: true, minimum: 0 }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        notes: { type: string, maxLength: 255 }
    Billing:
      type: object
      description: Snapshot financeiro gerado ao concluir um atendimento.
      required: [id, appointmentId, clientId, clientName, serviceId, serviceName, professionalId, professionalName, amount, paidAmount, remainingAmount, status, receivedBy, appointmentScheduledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid, nullable: true }
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        amount: { type: number }
        paidAmount: { type: number }
        remainingAmount: { type: number }
        status:
          type: string
          enum: [PENDING, PARTIALLY_PAID, PAID]
        receivedBy:
          type: string
          enum: [CLINIC, PROFESSIONAL]
        appointmentScheduledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CashMovement:
      type: object
      required: [id, billingId, type, status, paymentMethod, description, amount, countsInCash, occurredAt, clientName, serviceName, professionalName]
      properties:
        id: { type: string, format: uuid }
        billingId: { type: string, format: uuid, nullable: true }
        type:
          type: string
          enum: [INCOME, EXPENSE]
        status:
          type: string
          enum: [PENDING, PAID]
        paymentMethod:
          allOf:
            - $ref: "#/components/schemas/PaymentMethod"
          nullable: true
        description: { type: string, nullable: true }
        amount: { type: number }
        countsInCash: { type: boolean }
        occurredAt: { type: string, format: date-time }
        clientName: { type: string, nullable: true }
        serviceName: { type: string, nullable: true }
        professionalName: { type: string, nullable: true }
    PayBillingEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [billing, movement]
          properties:
            billing: { $ref: "#/components/schemas/Billing" }
            movement: { $ref: "#/components/schemas/CashMovement" }
    OpenCashRequest:
      type: object
      additionalProperties: false
      required: [openingAmount]
      properties:
        professionalId: { type: string, format: uuid }
        openingAmount: { type: number, minimum: 0 }
    CloseCashRequest:
      type: object
      additionalProperties: false
      required: [informedClosingAmount]
      properties:
        professionalId: { type: string, format: uuid }
        informedClosingAmount: { type: number, minimum: 0 }
    Cash:
      type: object
      required: [id, date, status, scope, professionalId, professionalName, openingAmount, totalPaid, totalExpenses, totalBalance, expectedClosingAmount, informedClosingAmount, differenceAmount, openedAt, closedAt, createdAt, movements]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date-time }
        status:
          type: string
          enum: [OPEN, CLOSED]
        scope:
          type: string
          enum: [CLINIC, PROFESSIONAL]
        professionalId: { type: string, format: uuid, nullable: true }
        professionalName: { type: string, nullable: true }
        openingAmount: { type: number }
        totalPaid: { type: number }
        totalExpenses: { type: number }
        totalBalance: { type: number }
        expectedClosingAmount: { type: number }
        informedClosingAmount: { type: number, nullable: true }
        differenceAmount: { type: number, nullable: true }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        movements:
          type: array
          items: { $ref: "#/components/schemas/CashMovement" }
    CashEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Cash" }
    NullableCashEnvelope:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Cash"
          nullable: true
